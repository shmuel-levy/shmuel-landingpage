<head>

<body>
<script>
window.DEMO = {
  theme: { bg: "linear-gradient(170deg,#FFFDF3,#FFEFB8)", accent: "#E9B627", "accent-deep": "#2F7D3B", ink: "#2A4A1A", soft: "#FFF6D9", "env-a": "#F5C542", "env-b": "#D99A1A" },
  deco: ["🌻", "🌼", "🦋", "☀️"],
  confettiEmoji: ["🌻", "🌼", "💛"],
  confetti: ["#F5C542", "#2F7D3B", "#F5A9C0", "#BFD3FF", "#FFFFFF"],
  steps: [
    { type: "envelope", to: "למירי הגננת 🌻", title: "יש לך דואר מגן חבצלת", letter: "🌻", hint: "לחצי על המעטפה" },
    { type: "photos", emoji: "📸", title: "השנה שלנו", doneText: "איזו שנה הייתה 💛", items: [
      { emoji: "🎨", caption: "יום הצבעים" },
      { emoji: "🍂", caption: "סוכות בגן" },
      { emoji: "🎭", caption: "פורים: 30 גיבורי-על וגננת אחת" },
      { emoji: "🌱", caption: "הגינה ששתלנו יחד" }
    ] },
    { type: "notes", emoji: "🗒️", title: "מה הילדים רצו להגיד", sub: "(בעזרת ההורים, בכתב יד)", items: [
      { text: "מירי, את הכי יפה בעולם", from: "נועם, 4" },
      { text: "תודה שעזרת לי לקשור שרוכים", from: "אלה" },
      { text: "אני אוהב את הסיפורים שלך", from: "יונתן" },
      { text: "את כמו אמא שנייה", from: "תמר" },
      { text: "את הכי טובה (וגם העוגיות)", from: "אורי" }
    ] },
    { type: "final", variant: "card", emoji: "🌻", title: "תודה, מירי", text: ["על הסבלנות, החיבוקים והלב הענק.", "הילדים שלנו גדלו השנה בזכותך, ואנחנו לא נשכח את זה."], sign: "באהבה, כל ההורים של גן חבצלת" }
  ]
};
