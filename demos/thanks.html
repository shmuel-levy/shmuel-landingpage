<script>
window.DEMO = {
  palette: "gold", liner: "dots", mood: "happy", orderType: "thanks",
  theme: { bg: "linear-gradient(170deg,#FFFDF3,#FFEFB8)", accent: "#E9B627", "accent-deep": "#2F7D3B", ink: "#2A4A1A", soft: "#FFF6D9" },
  deco: ["flower", "sun", "sprout", "heart"],
  confetti: ["#F5C542", "#2F7D3B", "#F5A9C0", "#BFD3FF", "#FFFFFF"],
  steps: [
    { type: "envelope", to: "למירי הגננת", title: "יש לך דואר מגן חבצלת", mark: "מ", card: { icon: "flower", title: "מגן חבצלת", text: "באהבה" }, hint: "הקישי על החותם" },
    { type: "photos", icon: "camera", title: "השנה שלנו", doneText: "איזו שנה הייתה", items: [
      { src: "photos/tulips.jpg", caption: "הגינה ששתלנו יחד" },
      { src: "photos/cookies.jpg", caption: "יום האפייה הגדול" },
      { src: "photos/strawberries.jpg", caption: "הטיול לקטיף תותים" },
      { src: "photos/flower.jpg", caption: "הפרח הראשון שפרח" }
    ] },
    { type: "notes", icon: "note", title: "מה הילדים רצו להגיד", sub: "(בעזרת ההורים, בכתב יד)", items: [
      { text: "מירי, את הכי יפה בעולם", from: "נועם, 4" },
      { text: "תודה שעזרת לי לקשור שרוכים", from: "אלה" },
      { text: "אני אוהב את הסיפורים שלך", from: "יונתן" },
      { text: "את כמו אמא שנייה", from: "תמר" },
      { text: "את הכי טובה (וגם העוגיות)", from: "אורי" }
    ] },
    { type: "final", variant: "card", icon: "flower", title: "תודה, מירי", text: ["על הסבלנות, החיבוקים והלב הענק.", "הילדים שלנו גדלו השנה בזכותך, ואנחנו לא נשכח את זה."], sign: "באהבה, כל ההורים של גן חבצלת" }
  ]
};
