    { type: "choice", icon: "heart-crack", title: "כמה את כועסת?", options: [
      { icon: "bolt", label: "מאוד", reply: "הוגן. תמשיכי, יש לי תוכנית." },
      { icon: "sad", label: "קצת", reply: "קצת זה כבר התחלה." },
      { icon: "gift", label: "תלוי מה יש בסוף", reply: "אז כדאי לך להמשיך." }

    { type: "scratch", icon: "gift", title: "גרדי לגלות את הפיצוי", sub: "עם האצבע, על כל הכרטיס", cover1: "#F3C7A9", cover2: "#FFE9DA",
