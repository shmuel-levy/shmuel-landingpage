<body>
<script>
window.DEMO = {
  theme: { bg: "linear-gradient(170deg,#FFF7F0,#FFD9C2)", accent: "#F08A5D", "accent-deep": "#A8441A", ink: "#5A2410", soft: "#FFEDE1", "env-a": "#F08A5D", "env-b": "#C25A2C" },
  deco: ["🧡", "🌷", "🥺", "✨"],
  confettiEmoji: ["🧡", "🌷", "🍕"],
  steps: [
    { type: "envelope", to: "למאיה 🧡", title: "אפשר רגע?", letter: "🥺", hint: "בבקשה תפתחי 🥺" },
    { type: "message", emoji: "😔", title: "אני יודע שפישלתי", text: ["שכחתי את הדייט שלנו. שוב.", "אין לי תירוץ טוב, אז במקום תירוץ הכנתי לך את זה."], cta: "טוב, נראה ←" },
    { type: "choice", emoji: "🌡️", title: "כמה את כועסת?", options: [
      { emoji: "😤", label: "מאוד", reply: "הוגן. תמשיכי, יש לי תוכנית." },
      { emoji: "😒", label: "קצת", reply: "קצת זה כבר התחלה 🙏" },
      { emoji: "😏", label: "תלוי מה יש בסוף", reply: "אז כדאי לך להמשיך 😅" }
    ] },
    { type: "scratch", emoji: "🎁", title: "גרדי לגלות את הפיצוי", sub: "עם האצבע, על כל הכרטיס", cover1: "#F3C7A9", cover2: "#FFE9DA",
      reveal: { emoji: "🍕💐", text: "ערב פיצה, פרחים, ואני שוטף כלים שבוע שלם", small: "בתוקף מיידי" }, cta: "עסקה טובה ←" },
    { type: "runaway", emoji: "🤗", title: "סולחת לי?", yes: "סולחת 🧡", no: "לא סולחת",
      noTexts: ["עוד קצת כועסת", "רגע...", "הכפתור לא מסכים", "נו מאיהההה", "בבקשהה 🥺"] },
    { type: "final", variant: "card", emoji: "🤗", title: "תודה שאת כזו", text: ["מבטיח לשים תזכורת. שלוש תזכורות.", "ולהגיע עם פרחים."], sign: "שלך, שלמד את הלקח" }
  ]
};
