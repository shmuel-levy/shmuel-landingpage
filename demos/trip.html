<script>
window.DEMO = {

    { type: "envelope", to: "לאהוב שלי ✈️", title: "יש לך הזמנה רשמית", letter: "🎫", hint: "לחץ על המעטפה" },
    { type: "message", emoji: "🎂", title: "יום הולדת שמח!", text: ["השנה החלטתי שמתנה רגילה לא מספיקה.", "אז הכנתי לך מסע קטן... מוכן?"], cta: "מוכן! ←" },
    { type: "choice", key: "mood", emoji: "🤔", title: "באיזה מוד אתה מגיע?", options: [
      { emoji: "😎", label: "רגוע וזורם", reply: "מושלם, כי אין לך מושג מה מחכה לך 😏" },
      { emoji: "🤩", label: "מתרגש רצח", reply: "תשמור על האנרגיה. תצטרך אותה!" },
      { emoji: "🥱", label: "צריך קפה קודם", reply: "דאגתי. יש קפה בשדה ☕" }

    { type: "checklist", emoji: "🧳", title: "מה לארוז?", sub: "סמן כל פריט שכבר בתיק", cta: "התיק מוכן! ←", doneText: "התיק מוכן!", items: [

    { type: "final", variant: "ticket", title: "הכרטיס שלך ✈️", ticket: {
