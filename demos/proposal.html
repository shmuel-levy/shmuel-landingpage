<script>
window.DEMO = {

  deco: ["heart", "sparkle", "ring", "star"],
  confetti: ["#9B7BD8", "#FFD45C", "#FFFFFF", "#F5A9C0", "#5E3FA3"],
  steps: [
    { type: "envelope", to: "לאהובה שלי", title: "יש לי משהו להגיד לך", mark: "א", card: { icon: "heart", title: "לאהובה שלי", text: "תפתחי לאט" }, hint: "הקישי על החותם" },
    { type: "photos", icon: "camera", title: "הרגעים שלנו", doneText: "ואלה רק חלק קטן", items: [
      { src: "photos/couple-bench.jpg", caption: "השקיעה הראשונה שלנו" },
      { src: "photos/santorini.jpg", caption: "הקיץ ההוא ביוון" },
      { src: "photos/canoe.jpg", caption: "האגם, והקנו שכמעט התהפך" },
      { src: "photos/heart-hands.jpg", caption: "ומאז, כל יום" }
    ] },
    { type: "message", icon: "hearts", title: "4 שנים. אלפי רגעים.", text: "ובכל אחד מהם הבנתי עוד קצת כמה אני רוצה את כל השאר איתך." },
